name: windows-helper-probe
on:
  push:
    paths:
      - .github/workflows/windows-helper-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Probe the exact helper program with its isolated environment
        shell: pwsh
        run: |
          @'
          import { readFileSync } from 'node:fs';
          import { spawn } from 'node:child_process';
          import { join } from 'node:path';
          const source = readFileSync('src/source/windows-attributes-worker.ts', 'utf8');
          const program = source.split('const PROGRAM = String.raw`')[1].split('`;')[0];
          const root = process.env.SystemRoot;
          const cases = [
            ['system-path', { PATH: join(root, 'System32') }],
            ['identity', Object.fromEntries(['USERNAME', 'USERDOMAIN', 'COMPUTERNAME', 'USERDNSDOMAIN', 'LOGONSERVER'].filter(k => process.env[k]).map(k => [k, process.env[k]]))],
            ['architecture', { PROCESSOR_ARCHITECTURE: 'AMD64', OS: 'Windows_NT' }],
            ['combined', Object.fromEntries(['PATH', 'LOCALAPPDATA', 'APPDATA', 'TEMP', 'TMP', 'USERPROFILE', 'ProgramFiles', 'ProgramData', 'USERNAME', 'USERDOMAIN', 'COMPUTERNAME', 'PROCESSOR_ARCHITECTURE', 'OS'].filter(k => process.env[k]).map(k => [k, process.env[k]]))],
          ];
          for (const [label, extra] of cases) {
            await new Promise(resolve => {
              const start = Date.now();
              const child = spawn(join(root, 'System32', 'WindowsPowerShell', 'v1.0', 'powershell.exe'),
                ['-NoLogo', '-NoProfile', '-NonInteractive', '-Command', program],
                { windowsHide: true, cwd: root, env: { SystemRoot: root, WINDIR: root, ...extra } });
              let out = '', err = '';
              child.stdout.on('data', data => out += data);
              child.stderr.on('data', data => err += data);
              const timer = setTimeout(() => child.kill(), 35000);
              child.on('error', error => console.log('[helper-probe] spawn:', error.code));
              child.on('close', code => {
                clearTimeout(timer);
                console.log('[helper-probe]', JSON.stringify({ label, code, ms: Date.now()-start, out, err }));
                resolve();
              });
              child.stdin.end(JSON.stringify([root]) + '\n');
            });
          }
          '@ | node --input-type=module
      - name: Probe the actual worker call
        shell: pwsh
        run: |
          node --input-type=module -e "import {assertNoReparsePoints} from './src/source/windows-attributes.ts'; assertNoReparsePoints([process.cwd()]); console.log('[helper-probe] actual worker OK');"
